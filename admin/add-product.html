<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="page-title">Add Product — LootLinks Admin</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
<div class="bg-atmosphere"></div>
<div class="admin-shell">
  <main class="admin-main">
    <div class="admin-header">
      <h1 id="header-title">Add Product</h1>
      <p>Fields marked * are required.</p>
    </div>

    <div class="panel" style="max-width:620px">
      <div class="form-row">
        <label for="title">Product Title *</label>
        <input type="text" id="title" placeholder="e.g. Wireless Bluetooth Headphones" required />
      </div>

      <div class="form-row">
        <label>Product Image *</label>
        <label class="upload-box" id="upload-box">
          <img id="img-preview" style="display:none" />
          <div id="upload-placeholder"><div class="upload-label">Click to upload JPG, PNG, or WebP</div></div>
          <input type="file" id="img-input" accept="image/jpeg,image/png,image/webp" />
        </label>
        <div class="hint">Or paste an image URL instead:</div>
        <input type="url" id="img-url" placeholder="https://..." style="margin-top:6px" />
      </div>

      <div class="form-row">
        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Short one-line description"></textarea>
      </div>

      <div class="form-row">
        <label for="url">Affiliate Link / Product URL *</label>
        <input type="url" id="url" placeholder="https://example.com/affiliate-link" required />
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="store">Store / Platform</label>
          <select id="store">
            <option>Amazon</option>
            <option>Flipkart</option>
            <option>Meesho</option>
            <option>Myntra</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="category">Category (optional)</label>
          <input type="text" id="category" placeholder="e.g. Electronics" />
        </div>
      </div>

      <div class="form-row" style="display:flex;gap:24px;flex-wrap:wrap">
        <label class="switch">
          <input type="checkbox" id="featured" />
          <span class="track"></span>
          Featured Product
        </label>
        <label class="switch">
          <input type="checkbox" id="active" checked />
          <span class="track"></span>
          Active
        </label>
      </div>

      <div style="display:flex;gap:10px">
        <button class="btn btn-primary" id="save-btn">Save Product</button>
        <a href="products.html" class="btn btn-secondary">Cancel</a>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const editId = params.get("id");
  let imageData = "";

  function setPreview(src) {
    if (!src) return;
    imageData = src;
    document.getElementById("img-preview").src = src;
    document.getElementById("img-preview").style.display = "block";
    document.getElementById("upload-placeholder").style.display = "none";
  }

  async function loadForEdit() {
    if (!editId) return;
    const p = await DB.Products.getById(editId);
    if (p) {
      document.getElementById("page-title").textContent = "Edit Product — LootLinks Admin";
      document.getElementById("header-title").textContent = "Edit Product";
      document.getElementById("title").value = p.title;
      document.getElementById("description").value = p.description;
      document.getElementById("url").value = p.url;
      document.getElementById("store").value = p.store;
      document.getElementById("category").value = p.category;
      document.getElementById("featured").checked = p.featured;
      document.getElementById("active").checked = p.active;
      setPreview(p.image);
      document.getElementById("img-url").value = p.image.startsWith("data:") ? "" : p.image;
    }
  }
  loadForEdit();

  document.getElementById("img-input").addEventListener("change", (e) => {
    Admin.fileToDataUrl(e.target.files[0], setPreview);
  });
  document.getElementById("img-url").addEventListener("input", (e) => {
    if (e.target.value.trim()) setPreview(e.target.value.trim());
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    const title = document.getElementById("title").value.trim();
    const url = document.getElementById("url").value.trim();
    if (!title) return Admin.toast("Product title is required", "error");
    if (!url) return Admin.toast("Affiliate link is required", "error");
    if (!imageData) return Admin.toast("Please add a product image", "error");

    const payload = {
      title,
      description: document.getElementById("description").value.trim(),
      image: imageData,
      url,
      store: document.getElementById("store").value,
      category: document.getElementById("category").value.trim(),
      featured: document.getElementById("featured").checked,
      active: document.getElementById("active").checked,
    };

    try {
      if (editId) {
        await DB.Products.update(editId, payload);
        Admin.toast("Product updated");
      } else {
        await DB.Products.add(payload);
        Admin.toast("Product added — now live on your site");
      }
      setTimeout(() => (window.location.href = "products.html"), 500);
    } catch (err) {
      Admin.toast(err.message || "Something went wrong saving this product", "error");
    }
  });
</script>
</body>
</html>
