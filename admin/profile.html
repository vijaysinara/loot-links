<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile Settings — LootLinks Admin</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
<div class="bg-atmosphere"></div>
<div class="admin-shell">
  <main class="admin-main">
    <div class="admin-header">
      <h1>Profile Settings</h1>
      <p>This is what visitors see at the top of your page.</p>
    </div>

    <div class="panel" style="max-width:520px">
      <h2>Logo / Profile Photo</h2>
      <p class="panel-desc">Square images work best — it will be cropped into a circle.</p>
      <label class="upload-box" id="upload-box">
        <img id="logo-preview" style="display:none" />
        <div id="upload-placeholder">
          <div class="upload-label">Click to upload JPG, PNG, or WebP</div>
        </div>
        <input type="file" id="logo-input" accept="image/jpeg,image/png,image/webp" />
      </label>

      <div class="form-row" style="margin-top:20px">
        <label for="name">Page / Brand Name</label>
        <input type="text" id="name" maxlength="60" />
      </div>
      <div class="form-row">
        <label for="bio">Bio / Description</label>
        <textarea id="bio" maxlength="160"></textarea>
        <div class="hint"><span id="bio-count">0</span>/160 characters</div>
      </div>

      <button class="btn btn-primary" id="save-btn">Save Changes</button>
    </div>
  </main>
</div>

<script src="../assets/js/db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  let logoData = "";

  async function init() {
    const p = await DB.Profile.get();
    document.getElementById("name").value = p.name;
    document.getElementById("bio").value = p.bio;
    document.getElementById("bio-count").textContent = (p.bio || "").length;
    logoData = p.logo || "";
    if (logoData) {
      document.getElementById("logo-preview").src = logoData;
      document.getElementById("logo-preview").style.display = "block";
      document.getElementById("upload-placeholder").style.display = "none";
    }
  }
  init();

  document.getElementById("bio").addEventListener("input", (e) => {
    document.getElementById("bio-count").textContent = e.target.value.length;
  });

  document.getElementById("logo-input").addEventListener("change", (e) => {
    Admin.fileToDataUrl(e.target.files[0], (dataUrl) => {
      logoData = dataUrl;
      document.getElementById("logo-preview").src = dataUrl;
      document.getElementById("logo-preview").style.display = "block";
      document.getElementById("upload-placeholder").style.display = "none";
    });
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    await DB.Profile.update({
      name: document.getElementById("name").value.trim() || "Your Brand",
      bio: document.getElementById("bio").value.trim(),
      logo: logoData || "",
    });
    Admin.toast("Profile saved — live site updated");
  });
</script>
</body>
</html>
