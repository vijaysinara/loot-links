<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analytics — LootLinks Admin</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
<div class="bg-atmosphere"></div>
<div class="admin-shell">
  <main class="admin-main">
    <div class="admin-header">
      <h1>Analytics</h1>
      <p>Visits and clicks recorded from your live site.</p>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="panel">
      <h2>Last 7 Days</h2>
      <p class="panel-desc">Clicks per day.</p>
      <div id="chart"></div>
    </div>

    <div class="panel">
      <h2>Clicks by Product</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product</th><th>Store</th><th>Clicks</th></tr></thead>
          <tbody id="clicks-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  async function init() {
  const [summary, products] = await Promise.all([DB.Analytics.summary(), DB.Products.getAll()]);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-card"><div class="label">Total Visitors</div><div class="value">${summary.totalVisitors}</div></div>
    <div class="stat-card"><div class="label">Total Product Clicks</div><div class="value">${summary.totalClicks}</div></div>
    <div class="stat-card"><div class="label">Today's Clicks</div><div class="value">${summary.todayClicks}</div></div>
    <div class="stat-card"><div class="label">Top Product</div><div class="value" style="font-size:16px">${
      summary.topProduct ? summary.topProduct.title : "—"
    }</div></div>
  `;

  // simple bar chart, pure SVG — no chart library dependency
  const max = Math.max(1, ...summary.days.map((d) => d.clicks));
  const w = 640, h = 180, barW = w / summary.days.length - 14;
  const bars = summary.days
    .map((d, i) => {
      const barH = (d.clicks / max) * (h - 40);
      const x = i * (w / summary.days.length) + 7;
      const y = h - barH - 24;
      const label = new Date(d.date).toLocaleDateString(undefined, { weekday: "short" });
      return `
      <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="var(--gold)" opacity="0.9" />
      <text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#f5f4f2">${d.clicks}</text>
      <text x="${x + barW / 2}" y="${h - 6}" text-anchor="middle" font-size="10" fill="#66655f">${label}</text>`;
    })
    .join("");
  document.getElementById("chart").innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:640px">${bars}</svg>`;

  const rows = [...products].sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
  document.getElementById("clicks-body").innerHTML = rows.length
    ? rows
        .map(
          (p) => `<tr>
      <td style="display:flex;align-items:center;gap:10px"><img class="thumb" src="${p.image}" alt=""/>${p.title}</td>
      <td>${p.store}</td>
      <td>${p.clicks || 0}</td>
    </tr>`
        )
        .join("")
    : `<tr class="empty-row"><td colspan="3">No data yet.</td></tr>`;
  }
  init();
</script>
</body>
</html>
