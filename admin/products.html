<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Products — LootLinks Admin</title>
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
<div class="bg-atmosphere"></div>
<div class="admin-shell">
  <main class="admin-main">
    <div class="admin-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
      <div>
        <h1>Products</h1>
        <p>Drag rows to reorder, or use the arrows. Order here matches the live site.</p>
      </div>
      <a href="add-product.html" class="btn btn-primary">+ Add Product</a>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th></th><th>Product</th><th>Store</th><th>Status</th><th>Clicks</th><th>Added</th><th>Actions</th></tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
  let dragId = null;

  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  async function render() {
    const products = await DB.Products.getAll();
    const body = document.getElementById("products-body");
    body.innerHTML = products.length
      ? products
          .map(
            (p, i) => `
        <tr data-id="${p.id}" draggable="true">
          <td style="cursor:grab;color:var(--text-faint)">⠿</td>
          <td style="display:flex;align-items:center;gap:10px">
            <img class="thumb" src="${p.image}" alt=""/>
            <div>
              <div style="font-weight:600">${p.title}${p.featured ? ' <span style="color:var(--gold);font-size:11px">★ featured</span>' : ""}</div>
            </div>
          </td>
          <td>${p.store}</td>
          <td><span class="status-pill ${p.active ? "status-active" : "status-inactive"}">${p.active ? "Active" : "Inactive"}</span></td>
          <td>${p.clicks || 0}</td>
          <td style="color:var(--text-dim)">${fmtDate(p.createdAt)}</td>
          <td class="row-actions">
            <button class="btn btn-secondary btn-sm move-up" ${i === 0 ? "disabled" : ""}>↑</button>
            <button class="btn btn-secondary btn-sm move-down" ${i === products.length - 1 ? "disabled" : ""}>↓</button>
            <button class="btn btn-secondary btn-sm toggle-btn">${p.active ? "Hide" : "Show"}</button>
            <a class="btn btn-secondary btn-sm" href="add-product.html?id=${p.id}">Edit</a>
            <button class="btn btn-danger btn-sm delete-btn">Delete</button>
          </td>
        </tr>`
          )
          .join("")
      : `<tr class="empty-row"><td colspan="7">No products yet — <a href="add-product.html" style="color:var(--gold)">add your first one</a>.</td></tr>`;

    body.querySelectorAll(".move-up").forEach((b) =>
      b.addEventListener("click", async (e) => {
        await DB.Products.move(e.target.closest("tr").dataset.id, -1);
        render();
      })
    );
    body.querySelectorAll(".move-down").forEach((b) =>
      b.addEventListener("click", async (e) => {
        await DB.Products.move(e.target.closest("tr").dataset.id, 1);
        render();
      })
    );
    body.querySelectorAll(".toggle-btn").forEach((b) =>
      b.addEventListener("click", async (e) => {
        await DB.Products.toggleActive(e.target.closest("tr").dataset.id);
        Admin.toast("Visibility updated");
        render();
      })
    );
    body.querySelectorAll(".delete-btn").forEach((b) =>
      b.addEventListener("click", async (e) => {
        const row = e.target.closest("tr");
        if (confirm("Delete this product? This can't be undone.")) {
          await DB.Products.remove(row.dataset.id);
          Admin.toast("Product deleted");
          render();
        }
      })
    );

    // drag & drop reorder
    body.querySelectorAll("tr[draggable]").forEach((row) => {
      row.addEventListener("dragstart", () => {
        dragId = row.dataset.id;
        row.style.opacity = "0.4";
      });
      row.addEventListener("dragend", () => (row.style.opacity = "1"));
      row.addEventListener("dragover", (e) => e.preventDefault());
      row.addEventListener("drop", async (e) => {
        e.preventDefault();
        const targetId = row.dataset.id;
        if (!dragId || dragId === targetId) return;
        const all = await DB.Products.getAll();
        const ids = all.map((p) => p.id);
        const from = ids.indexOf(dragId);
        const to = ids.indexOf(targetId);
        ids.splice(from, 1);
        ids.splice(to, 0, dragId);
        await DB.Products.reorder(ids);
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
